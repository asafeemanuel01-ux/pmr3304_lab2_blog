<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Blog{% endblock %} | Blog de Mecatrônica</title>
  <style>
    :root { --cor: #0f6e8c; --texto: #1d2733; --cinza: #6b7785; --fundo: #f5f7f9; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           color: var(--texto); background: var(--fundo); line-height: 1.6; }
    header { background: var(--cor); color: #fff; padding: 1rem 0; }
    header .wrap { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .5rem; }
    header h1 { margin: 0; font-size: 1.4rem; }
    header a { color: #fff; text-decoration: none; }
    nav a { margin-left: 1rem; opacity: .9; }
    nav a:hover { opacity: 1; text-decoration: underline; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 0 1.25rem; }
    main { background: #fff; margin: 1.5rem auto; padding: 1.5rem 2rem; border-radius: 8px;
           box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    a { color: var(--cor); }
    .meta { color: var(--cinza); font-size: .9rem; margin-top: -.5rem; }
    .post-list { list-style: none; padding: 0; }
    .post-list li { padding: .6rem 0; border-bottom: 1px solid #e6e9ec; }
    .post-list li a { font-size: 1.1rem; font-weight: 600; text-decoration: none; }
    .post-list small { display: block; color: var(--cinza); }
    .actions a, .button, button { display: inline-block; padding: .4rem .9rem; border-radius: 5px;
           border: 1px solid var(--cor); background: #fff; color: var(--cor); text-decoration: none;
           font-size: .95rem; cursor: pointer; margin-right: .3rem; }
    .button.primary, button { background: var(--cor); color: #fff; }
    button.danger { background: #c0392b; border-color: #c0392b; }
    form p label { display: block; font-weight: 600; margin-bottom: .2rem; }
    form label { display: block; font-weight: 600; margin: .6rem 0 .2rem; }
    input[type=text], textarea, select { width: 100%; padding: .5rem; border: 1px solid #c8ced4;
           border-radius: 5px; font: inherit; }
    .errorlist { color: #c0392b; padding-left: 1rem; }
    .tag { display: inline-block; background: #e3f1f5; color: var(--cor); padding: .1rem .6rem;
           border-radius: 999px; margin-right: .3rem; text-decoration: none; font-size: .9rem; }
    .comment { border-left: 3px solid var(--cor); padding: .2rem 0 .2rem 1rem; margin: 1rem 0; }
    .comment p { margin: .2rem 0; }
    footer { text-align: center; color: var(--cinza); font-size: .85rem; padding-bottom: 2rem; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1><a href="{% url 'blog:index' %}">Blog de Mecatrônica</a></h1>
      <nav>
        <a href="{% url 'blog:index' %}">Posts</a>
        <a href="{% url 'blog:categories' %}">Categorias</a>
        <a href="{% url 'blog:create' %}">Novo post</a>
        <a href="{% url 'admin:index' %}">Admin</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer>PMR3304 – Sistemas de Informação · 2026</footer>
</body>
</html>
